<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ferris Wheel</title>
    <meta name="description" content="An animated carnival scene built with pure HTML and CSS — a turning Ferris wheel with riders, a big-top tent, and a starry dusk sky." />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Carnival Ferris Wheel" />
    <meta property="og:description" content="An animated carnival scene built with pure HTML and CSS — a turning Ferris wheel with riders, a big-top tent, and a starry dusk sky." />
    <meta property="og:image" content="https://nirvesh.github.io/ferris-wheel/ferris-wheel.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Carnival Ferris Wheel" />
    <meta name="twitter:description" content="An animated carnival scene built with pure HTML and CSS — a turning Ferris wheel with riders, a big-top tent, and a starry dusk sky." />
    <meta name="twitter:image" content="https://nirvesh.github.io/ferris-wheel/ferris-wheel.png" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="scene">
      <div class="moon"></div>

      <!-- stars -->
      <span class="star"></span><span class="star"></span><span class="star"></span>
      <span class="star"></span><span class="star"></span><span class="star"></span>
      <span class="star"></span><span class="star"></span><span class="star"></span>
      <span class="star"></span><span class="star"></span><span class="star"></span>
      <span class="star"></span><span class="star"></span>

      <!-- big top tent -->
      <div class="tent"><div class="tent__top"></div><span class="flag"></span></div>

      <div class="ground"></div>

      <!-- ride: wheel + mount, all sized off the wheel so they stay aligned -->
      <div class="ferris">
        <div class="base"></div>
        <div class="leg leg--l"></div>
        <div class="leg leg--r"></div>

        <div class="wheel">
          <span class="line"></span>
          <span class="line"></span>
          <span class="line"></span>
          <span class="line"></span>
          <span class="line"></span>
          <span class="line"></span>

          <div class="cabin"><span class="kid"></span><span class="kid"></span><span class="car-front"></span></div>
          <div class="cabin"><span class="kid"></span><span class="kid"></span><span class="car-front"></span></div>
          <div class="cabin"><span class="kid"></span><span class="kid"></span><span class="car-front"></span></div>
          <div class="cabin"><span class="kid"></span><span class="kid"></span><span class="car-front"></span></div>
          <div class="cabin"><span class="kid"></span><span class="kid"></span><span class="car-front"></span></div>
          <div class="cabin"><span class="kid"></span><span class="kid"></span><span class="car-front"></span></div>
        </div>

        <div class="hub"></div>

        <div class="light-ring">
          <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
          <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
          <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
          <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
        </div>
      </div>
    </div>
  </body>
</html>
